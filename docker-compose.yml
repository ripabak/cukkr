services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cukkr
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cukkr}
      POSTGRES_DB: cukkr
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cukkr"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_PORT:-5432}:5432"

  backend:
    build:
      context: ./cukkr-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://cukkr:${DB_PASSWORD:-cukkr}@postgres:5432/cukkr
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${PUBLIC_API_URL:-https://api.cukkr.com}
      CORS_ORIGIN: ${PUBLIC_APP_URL:-https://app.cukkr.com},${PUBLIC_WEB_URL:-https://cukkr.com}
      CLIENT_URL: ${PUBLIC_APP_URL:-https://app.cukkr.com}
      WEB_URL: ${PUBLIC_WEB_URL:-https://cukkr.com}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://localhost:9000}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-cukkr}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-your-storage-access-key}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-your-storage-secret-key}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      WALK_IN_TOKEN_SECRET: ${WALK_IN_TOKEN_SECRET:-walk-in-token-secret-minimum-32-chars-dev}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-your-vapid-public-key-placeholder}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-your-vapid-private-key-placeholder}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:support@cukkr.com}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  strapi:
    build:
      context: ./cukkr-strapi
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_URL: postgresql://cukkr:${DB_PASSWORD:-cukkr}@postgres:5432/cukkr_strapi
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: cukkr_strapi
      DATABASE_USERNAME: cukkr
      DATABASE_PASSWORD: ${DB_PASSWORD:-cukkr}
      DATABASE_SSL: "false"
      APP_KEYS: ${STRAPI_APP_KEYS:-toBeModified1,toBeModified2}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:-tobemodified}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:-tobemodified}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:-tobemodified}
      JWT_SECRET: ${STRAPI_JWT_SECRET:-tobemodified}
      ENCRYPTION_KEY: ${STRAPI_ENCRYPTION_KEY:-tobemodified}
    volumes:
      - strapi_uploads:/opt/app/public/uploads
    ports:
      - "${STRAPI_PORT:-1337}:1337"

  web:
    build:
      context: ./cukkr-web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.cukkr.com}
        NEXT_PUBLIC_AUTH_URL: ${PUBLIC_AUTH_URL:-https://api.cukkr.com/auth/api}
        NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.cukkr.com}
        NEXT_PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://cukkr.com}
        STRAPI_URL: http://strapi:1337
        STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
        STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://localhost:9000}
    depends_on:
      - backend
      - strapi
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      STRAPI_URL: http://strapi:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.cukkr.com}
      NEXT_PUBLIC_AUTH_URL: ${PUBLIC_AUTH_URL:-https://api.cukkr.com/auth/api}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.cukkr.com}
      NEXT_PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://cukkr.com}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://localhost:9000}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    ports:
      - "${WEB_PORT:-3001}:3000"

  frontend:
    build:
      context: ./cukkr-frontend
      args:
        EXPO_PUBLIC_ENV_CODE: ${EXPO_PUBLIC_ENV_CODE:-production}
        EXPO_PUBLIC_ENV_API_URL: ${PUBLIC_API_URL:-https://api.cukkr.com}
        EXPO_PUBLIC_ENV_AUTH_URL: ${PUBLIC_AUTH_URL:-https://api.cukkr.com/auth/api}
        EXPO_PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://cukkr.com}
        EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-your-vapid-public-key-placeholder}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  strapi_uploads:
